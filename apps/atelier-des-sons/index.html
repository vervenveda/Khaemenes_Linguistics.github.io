<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L'Atelier des Sons · Khaemenes Academy</title><style>*{box-sizing:border-box}body{margin:0;color:#263648;background:#f7f0e3;font:400 18px/1.7 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:22px 14px}h1,h2{font-family:Georgia,serif;font-weight:400}h1{text-align:center}article,section{background:#fffdf7;border:1px solid #bcaa85;border-radius:7px;padding:19px;margin:15px 0}button,select{font:inherit;border:1px solid #8d754b;border-radius:7px;padding:10px;background:#fff4db;color:#263648;cursor:pointer;margin:5px}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #205d75;outline-offset:2px}button:disabled{opacity:.55}.choices{display:flex;flex-wrap:wrap}.french{font:400 23px/1.6 Georgia,serif}small{color:#526071}a{color:#245d55}@media(max-width:300px){main{padding:8px}button{width:100%;margin:5px 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{button{display:none!important}article{break-inside:avoid}}</style></head><body><main><p><a href="../French_101_index.html">← French 101</a> · <a href="../le-monde-vivant/">Café des Rencontres</a></p><h1>L'Atelier des Sons</h1><p>French Sound Laboratory · Explore pronunciation patterns through listening and comparison. Speech is optional; written guidance always remains available.</p><section><label for="soundSet">Choose a sound investigation</label><select id="soundSet"></select><h2 id="heading"></h2><p id="guide"></p><div id="pairs"></div><p id="challenge"></p><div id="answers" class="choices"></div><p id="feedback" role="status"></p><button id="next">New listening challenge</button></section><footer><small>Original Khaemenes Academy lesson · Jennifer Kay Pearl · Free and privacy-conscious</small></footer></main><script>"use strict";function recordFrenchPractice(activity,score,total){try{const name=(localStorage.getItem("french101_active_learner")||"").trim().replace(/\s+/g," ").slice(0,70);const id=name?Array.from(name.toLocaleLowerCase("en"),c=>c.codePointAt(0).toString(16)).join("-"):"anonymous";const key="khaemenes_french_practice_v1_"+id;let data;try{data=JSON.parse(localStorage.getItem(key)||"{}")}catch{data={}}if(!data||typeof data!=="object"||Array.isArray(data))data={};const prior=Array.isArray(data[activity])?data[activity]:[];prior.push({at:new Date().toISOString(),score,total});data[activity]=prior.slice(-20);localStorage.setItem(key,JSON.stringify(data));return true}catch{return false}}const topics=[
{title:"French u and ou",guide:"French ou sounds like /u/ in tout. French u /y/ uses rounded lips with the tongue high and forward. Do not treat these as equivalent.",words:[["tu","you (informal)"],["tout","all"],["rue","street"],["roue","wheel"]]},
{title:"Nasal vowel awareness",guide:"A nasal vowel allows airflow through the nose. Listen carefully; these are approximations and voices vary by device.",words:[["pain","bread"],["pont","bridge"],["vin","wine (vocabulary example only)"],["vent","wind"]]},
{title:"Silent final consonants",guide:"Many final consonants are silent in French, but not all. Compare chat and sac; avoid assuming every final consonant disappears.",words:[["chat","cat"],["sac","bag"],["petit","small"],["avec","with"]]},
{title:"Liaison in short phrases",guide:"In some contexts a usually silent consonant is pronounced before a vowel. Listen for the linking sound in les amis.",words:[["les amis","the friends"],["un ami","a friend"],["vous avez","you have"],["les enfants","the children"]]}
];const $=id=>document.getElementById(id);let current=0,expected=0,soundAnswered=false,soundPlayed=false,soundWrong=false;topics.forEach((t,i)=>{const o=document.createElement("option");o.value=i;o.textContent=t.title;$("soundSet").append(o)});function speak(w){
 const feedback=$("feedback");
 if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){feedback.textContent="French audio unavailable; use the written examples.";return false}
 try{
  const voices=speechSynthesis.getVoices()||[];
  const voice=voices.find(v=>String(v.lang||"").toLowerCase()==="fr-fr")||voices.find(v=>String(v.lang||"").toLowerCase().startsWith("fr"))||null;
  if(!voice){feedback.textContent="French voice unavailable. Compare the written words instead.";return false}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(w);u.lang=voice.lang;u.voice=voice;u.rate=.75;
  u.onerror=()=>{feedback.textContent="Playback failed. Continue with text-supported practice.";if($("answers"))for(const button of $("answers").querySelectorAll("button"))button.disabled=false};
  speechSynthesis.speak(u);return true;
 }catch{feedback.textContent="Audio playback unavailable. Study the written words.";return false}
}
function paint(){const t=topics[current];$("heading").textContent=t.title;$("guide").textContent=t.guide;$("pairs").replaceChildren();for(const [word,meaning] of t.words){const p=document.createElement("p"),b=document.createElement("button");b.textContent="🔊 "+word;b.onclick=()=>speak(word);p.append(b,document.createTextNode(" — "+meaning));$("pairs").append(p)}challenge()}function challenge(){soundAnswered=false;soundPlayed=false;soundWrong=false;const t=topics[current];expected=Math.floor(Math.random()*t.words.length);$("challenge").textContent="Play the mystery sound, then identify the expression. Without audio, use the visible study list. Audio-assisted first tries and guided study are tracked separately; neither is an independently verified listening test.";$("feedback").textContent="";$("answers").replaceChildren();for(const [i,word] of t.words.entries()){const b=document.createElement("button");b.textContent=word[0];b.disabled=true;b.onclick=()=>{if(soundAnswered)return;if(i===expected){soundAnswered=true;recordFrenchPractice(soundPlayed&&!soundWrong?"sound_audio_assisted_first_try":"sound_guided_study",1,1);$("feedback").textContent="Correct. Listen again and repeat.";for(const child of $("answers").querySelectorAll("button"))if(child!==$("answers").firstElementChild)child.disabled=true}else{soundWrong=true;$("feedback").textContent="Try listening again, then choose the word you heard."}};$("answers").append(b)}const play=document.createElement("button");play.textContent="▶ Play mystery sound";play.onclick=()=>{if("speechSynthesis" in window){soundPlayed=true;for(const child of $("answers").querySelectorAll("button"))child.disabled=false}speak(t.words[expected][0])};$("answers").prepend(play);if(!("speechSynthesis" in window)){for(const child of $("answers").querySelectorAll("button"))child.disabled=false;$("feedback").textContent="No audio engine: text-supported study only."}}$("soundSet").onchange=()=>{current=Number($("soundSet").value);paint()};$("next").onclick=challenge;paint();</script>
