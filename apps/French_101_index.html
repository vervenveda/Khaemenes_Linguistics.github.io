<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>French 101 — Sovereign Edition</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
:root{
  --bg-light:#f7f2e8; --text-light:#1b130a; --accent:#c7a85b;
  --bg-dark:#0f1a26;  --text-dark:#f5f5f5;  --accent-dark:#4da3ff;
  --radius:12px; --transition:.6s ease;
}
*{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif;}
html,body{margin:0;min-height:100%;overflow-x:hidden;overflow-y:auto;}
body{
  background:var(--bg-light);color:var(--text-light);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:background var(--transition),color var(--transition);
}
body.dark{
  background:var(--bg-dark);color:var(--text-dark);
}
button{
  background:var(--accent);color:#fff;border:none;border-radius:var(--radius);
  padding:10px 20px;font-size:1rem;cursor:pointer;margin:4px;
  transition:opacity .3s;
}
body.dark button{background:var(--accent-dark);}
button:hover{opacity:.8;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{#splash,#themeToggle,#menu,#lesson,#quiz,#exam,#certificateBack,#certificate button{display:none!important}#app{padding:0;min-height:auto}#certificate{display:block!important;color:#111;background:#fff;border:1px solid #333}}
.hidden{display:none;}
h1,h2,h3{margin:.3em 0;}
#app{width:100%;min-height:100vh;padding:76px 16px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
#splash{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:10;
  background:linear-gradient(135deg,#002654,#fff,#ed2939);
  background-size:600% 600%;animation:bgShift 20s ease infinite;
  color:#fff;text-shadow:0 0 12px rgba(0,0,0,.4);
}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#themeToggle{position:absolute;top:12px;right:12px;padding:8px 14px;font-size:.9rem;}
.level-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:20px;}
.level{
  width:80px;height:80px;border-radius:50%;border:3px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;cursor:pointer;transition:transform .3s,background .3s;
}
body.dark .level{border-color:var(--accent-dark);}
.level.locked{opacity:.35;cursor:not-allowed;}.level:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #95742a;outline-offset:3px}input{max-width:100%;min-height:42px;padding:9px 12px;border:1px solid #93835f;border-radius:7px;font:inherit}
.level.unlocked:hover{transform:scale(1.08);}
.level.completed{background:var(--accent);color:#fff;}
body.dark .level.completed{background:var(--accent-dark);}
#lesson,#quiz,#exam,#certificate{width:min(100%,700px);padding:20px;}.vocab{gap:12px;text-align:left}.vocab .speaker{flex:0 0 auto;padding:9px 12px}.level-grid{max-width:600px;margin:20px auto}.level:disabled{color:inherit}
.vocab{display:flex;align-items:center;justify-content:space-between;margin:6px 0;padding:8px;border-radius:8px;background:rgba(0,0,0,.05);}
body.dark .vocab{background:rgba(255,255,255,.1);}
.speaker{cursor:pointer;font-size:1.2rem;}
#certificate{border:4px solid var(--accent);border-radius:var(--radius);padding:40px;}
body.dark #certificate{border-color:var(--accent-dark);}
@keyframes confetti{0%{transform:translateY(0) rotate(0);}100%{transform:translateY(100vh) rotate(720deg);}}
.confetti{
  position:fixed;top:-10px;width:10px;height:10px;background:var(--accent);
  animation:confetti 5s linear infinite;opacity:.8;z-index:9999;
}
body.dark .confetti{background:var(--accent-dark);}
</style>
</head>

<body>
<div id="splash">
  <h1>Bienvenue à French 101</h1>
  <h3>Sovereign Edition</h3>
  <p style="max-width:420px;">A language journey guided by your own light.</p>
  <button onclick="startApp()">Commencer / Start Journey</button>
</div>

<div id="app" class="hidden">
  <button id="themeToggle">🌙 Mode</button>
  <h1 id="title">French 101</h1>
  <div id="menu">
    <p>Choose your Level — progress saves automatically.</p>
    <div class="level-grid" id="levelGrid"></div>
  </div>

  <div id="lesson" class="hidden"></div>
  <div id="quiz" class="hidden"></div>
  <div id="exam" class="hidden"></div>
  <div id="certificate" class="hidden">
    <h2>🎓 Certificate of Completion</h2>
    <p>Félicitations ! You have completed all 12 levels of French 101.</p><p id="certificateDetails"></p>
    <button onclick="print()">Print Certificate</button>
  </div>
</div>

<script>
/* French 101 — 12 lesson study pathway with 80% assessment gates.
   Preserves the existing theme, splash, progress key, audio, and certificate UI.
   This is independent of the formal Five-Language Academy record system. */
"use strict";
const totalLevels=12;
const LESSONS={"1":[{"fr":"Bonjour","en":"Hello"},{"fr":"Merci","en":"Thank you"},{"fr":"Au revoir","en":"Goodbye"},{"fr":"S’il vous plaît","en":"Please"},{"fr":"Oui","en":"Yes"}],"2":[{"fr":"Comment ça va ?","en":"How are you?"},{"fr":"Je vais bien.","en":"I'm fine."},{"fr":"Je m'appelle Marie.","en":"My name is Marie."},{"fr":"Enchanté.","en":"Nice to meet you."},{"fr":"À bientôt.","en":"See you soon."}],"3":[{"fr":"Un","en":"One"},{"fr":"Deux","en":"Two"},{"fr":"Trois","en":"Three"},{"fr":"Quatre","en":"Four"},{"fr":"Cinq","en":"Five"}],"4":[{"fr":"Voici ma famille.","en":"Here is my family."},{"fr":"Ma mère","en":"My mother"},{"fr":"Mon père","en":"My father"},{"fr":"Ma sœur","en":"My sister"},{"fr":"Mon frère","en":"My brother"}],"5":[{"fr":"Aujourd'hui","en":"Today"},{"fr":"Demain","en":"Tomorrow"},{"fr":"Hier","en":"Yesterday"},{"fr":"Lundi","en":"Monday"},{"fr":"Dimanche","en":"Sunday"}],"6":[{"fr":"Rouge","en":"Red"},{"fr":"Bleu","en":"Blue"},{"fr":"Vert","en":"Green"},{"fr":"Jaune","en":"Yellow"},{"fr":"Blanc","en":"White"}],"7":[{"fr":"J'ai faim.","en":"I am hungry."},{"fr":"De l'eau, s'il vous plaît.","en":"Water, please."},{"fr":"Du pain","en":"Bread"},{"fr":"Une pomme","en":"An apple"},{"fr":"J'aime le fromage.","en":"I like cheese."}],"8":[{"fr":"Je suis étudiant.","en":"I am a student."},{"fr":"Un livre","en":"A book"},{"fr":"Un stylo","en":"A pen"},{"fr":"La bibliothèque","en":"The library"},{"fr":"Je lis en français.","en":"I read in French."}],"9":[{"fr":"Où est la gare ?","en":"Where is the station?"},{"fr":"À gauche","en":"To the left"},{"fr":"À droite","en":"To the right"},{"fr":"Tout droit","en":"Straight ahead"},{"fr":"C'est près d'ici.","en":"It is near here."}],"10":[{"fr":"Il fait beau.","en":"The weather is nice."},{"fr":"Il pleut.","en":"It is raining."},{"fr":"Il fait froid.","en":"It is cold."},{"fr":"Il fait chaud.","en":"It is hot."},{"fr":"Le ciel est bleu.","en":"The sky is blue."}],"11":[{"fr":"Je me réveille tôt.","en":"I wake up early."},{"fr":"Je prends le petit déjeuner.","en":"I eat breakfast."},{"fr":"Je vais à l'école.","en":"I go to school."},{"fr":"Je travaille aujourd'hui.","en":"I work today."},{"fr":"Je rentre à la maison.","en":"I go home."}],"12":[{"fr":"J'ai étudié hier.","en":"I studied yesterday."},{"fr":"Je vais voyager demain.","en":"I am going to travel tomorrow."},{"fr":"Je voudrais apprendre.","en":"I would like to learn."},{"fr":"Je peux vous aider.","en":"I can help you."},{"fr":"Nous allons pratiquer.","en":"We are going to practice."}]};
const $=id=>document.getElementById(id);
const safeGet=key=>{try{return localStorage.getItem(key)}catch{return null}};
const safeSet=(key,value)=>{try{localStorage.setItem(key,value);return true}catch{return false}};
function readProgress(){
 try{const o=JSON.parse(safeGet("french101_progress")||"{}");return o&&typeof o==="object"&&!Array.isArray(o)?o:{}}catch{return {}}
}
const progress=readProgress();
let currentLevel=null;
function saveProgress(){return safeSet("french101_progress",JSON.stringify(progress))}
function available(level){return level===1||progress[level]==="completed"||progress[level]==="unlocked"||progress[level-1]==="completed"}
function showOnly(name){
 assessmentSession++;
 for(const id of ["menu","lesson","quiz","exam","certificate"])$(id).classList.toggle("hidden",id!==name);
}
function startApp(){
 $("splash").style.display="none";$("app").classList.remove("hidden");
 buildLevelGrid();applyTheme();showOnly("menu");
}
function applyTheme(){document.body.classList.toggle("dark",safeGet("french101_theme")==="dark"||(!safeGet("french101_theme")&&safeGet("theme")==="dark"))}
$("themeToggle").addEventListener("click",()=>{
 const dark=!document.body.classList.contains("dark");
 document.body.classList.toggle("dark",dark);
 safeSet("french101_theme",dark?"dark":"light");
});
function buildLevelGrid(){
 const grid=$("levelGrid");grid.replaceChildren();
 for(let i=1;i<=totalLevels;i++){
  const button=document.createElement("button");button.type="button";button.className="level";
  const enabled=available(i),done=progress[i]==="completed";
  button.textContent="L"+i;
  button.disabled=!enabled;
  button.classList.add(done?"completed":enabled?"unlocked":"locked");
  button.setAttribute("aria-label",`Level ${i}: ${done?"complete":enabled?"available":"locked"}`);
  if(enabled)button.addEventListener("click",()=>openLesson(i));
  grid.append(button);
 }
}
function backToMenu(){showOnly("menu");buildLevelGrid()}
function speakFR(text){
 if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){alert("French speech is not available on this device.");return}
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);utterance.lang="fr-FR";
 const voices=speechSynthesis.getVoices();
 utterance.voice=voices.find(v=>v.lang?.toLowerCase()==="fr-fr")||voices.find(v=>v.lang?.toLowerCase().startsWith("fr"))||null;
 utterance.rate=.86;
 speechSynthesis.speak(utterance);
}
function element(tag,text,className){
 const node=document.createElement(tag);node.textContent=text;
 if(className)node.className=className;return node;
}
function addButton(parent,label,handler){
 const button=element("button",label);button.type="button";button.addEventListener("click",handler);parent.append(button);return button;
}
function openLesson(level){
 if(!available(level)||!LESSONS[level]){backToMenu();return}
 currentLevel=level;const box=$("lesson");box.replaceChildren();
 box.append(element("h2",`Level ${level}`),element("p","Listen and repeat each phrase, then complete the quiz."));
 for(const phrase of LESSONS[level]){
  const row=element("div","","vocab");const labels=element("span");
  const french=element("strong",phrase.fr),english=element("small",phrase.en);
  french.lang="fr";labels.append(french,document.createElement("br"),english);
  const speak=element("button","🔊","speaker");
  speak.type="button";speak.setAttribute("aria-label","Hear French: "+phrase.fr);
  speak.addEventListener("click",()=>speakFR(phrase.fr));
  row.append(labels,speak);box.append(row);
 }
 addButton(box,"Take Quiz",()=>openQuiz(level));
 addButton(box,"Back to Levels",backToMenu);
 showOnly("lesson");
}
const ACCEPTED_TRANSLATIONS={
 "Bonjour":["hi","good morning"],"Merci":["thanks"],"Au revoir":["bye","good bye"],
 "Comment ça va ?":["how is it going"],"Enchanté.":["pleased to meet you"],
 "À bientôt.":["see you later"],"Ma mère":["my mom"],"Mon père":["my dad"],
 "À gauche":["left"],"À droite":["right"],"Tout droit":["go straight"],
 "Il pleut.":["it's raining"],"Il fait froid.":["it's cold"],"Il fait chaud.":["it's hot"]
};
function matchesTranslation(item,value){
 return [item.en,...(ACCEPTED_TRANSLATIONS[item.fr]||[])].some(answer=>normalize(answer)===normalize(value));
}
function shuffleQuestions(items){
 const result=[...items];
 for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}
 return result;
}
let assessmentSession=0;
function normalize(s){
 return String(s).normalize("NFKD").toLowerCase().replace(/[\u0300-\u036f]/g,"").replace(/[’‘]/g,"'").replace(/[^a-z0-9]+/g," ").trim();
}
function openQuiz(level){
 if(!available(level)||!LESSONS[level])return;
 const set=shuffleQuestions(LESSONS[level]),box=$("quiz");box.replaceChildren();
 box.append(element("h2",`Quiz — Level ${level}`),element("p","Translate each French phrase into English. Pass with at least 80% (4 out of 5)."));
 const question=element("p");question.style.fontSize="1.2rem";question.lang="fr";
 const input=document.createElement("input");input.type="text";input.placeholder="English meaning";input.autocomplete="off";input.setAttribute("aria-label","English translation");
 const feedback=element("p");feedback.setAttribute("role","status");
 const submit=element("button","Check answer");submit.type="button";
 box.append(question,input,submit,feedback);
 addButton(box,"Back to Levels",backToMenu);
 let index=0,score=0,busy=false;const session=assessmentSession+1;
 function finish(){
  input.disabled=true;submit.disabled=true;const passed=score>=Math.ceil(set.length*.8);
  feedback.textContent=`Score: ${score}/${set.length}. ${passed?"Passed!":"Practice and try again."}`;
  if(passed){
   progress[level]="completed";
   if(level<totalLevels&&progress[level+1]!=="completed")progress[level+1]="unlocked";
   saveProgress();
   addButton(box,level<totalLevels?"Next Level":"Final Exam",()=>{
    if(level<totalLevels)openLesson(level+1);else openExam();
   });
  }else addButton(box,"Retry Quiz",()=>openQuiz(level));
  buildLevelGrid();
 }
 function ask(){busy=false;if(index>=set.length){finish();return}question.textContent=set[index].fr;input.focus()}
 function check(){
  if(busy||index>=set.length||!input.value.trim())return;
  busy=true;submit.disabled=true;
  const correct=matchesTranslation(set[index],input.value);
  if(correct)score++;
  feedback.textContent=correct?"Correct!":"Expected: "+set[index].en;
  index++;input.value="";
  setTimeout(()=>{if(session!==assessmentSession||!document.contains(box)||box.classList.contains("hidden"))return;submit.disabled=false;ask()},550);
 }
 submit.addEventListener("click",check);
 input.addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();check()}});
 showOnly("quiz");ask();
}
function openExam(){
 if(!Array.from({length:totalLevels},(_,i)=>i+1).every(i=>progress[i]==="completed")){backToMenu();return}
 const box=$("exam");box.replaceChildren();
 box.append(element("h2","French 101 — Final Exam"),element("p","Answer 10 questions from the 12 levels. At least 80% is required for a certificate."));
 const pool=Object.values(LESSONS).flat();
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 const questions=pool.slice(0,10),prompt=element("p");prompt.lang="fr";prompt.style.fontSize="1.2rem";
 const input=document.createElement("input");input.type="text";input.autocomplete="off";input.setAttribute("aria-label","English translation");
 const feedback=element("p");feedback.setAttribute("role","status");
 const submit=element("button","Check answer");submit.type="button";
 box.append(prompt,input,submit,feedback);
 addButton(box,"Back to Levels",backToMenu);
 let i=0,score=0;
 function ask(){if(i>=questions.length){finish();return}prompt.textContent=questions[i].fr;input.focus()}
 function finish(){
  input.disabled=true;submit.disabled=true;
  const passed=score>=8;
  feedback.textContent=`Final exam: ${score}/10. ${passed?"Passed!":"80% required. Please retry."}`;
  if(passed){progress.examPassed=true;progress.examScore=score;progress.completedAt=new Date().toISOString();saveProgress();addButton(box,"View Certificate",openCertificate)}
  else addButton(box,"Retry Final",openExam);
 }
 function check(){
  if(i>=questions.length||!input.value.trim())return;
  if(matchesTranslation(questions[i],input.value))score++;
  i++;input.value="";ask();
 }
 submit.addEventListener("click",check);
 input.addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();check()}});
 showOnly("exam");ask();
}
function openCertificate(){
 if(!progress.examPassed||!Array.from({length:totalLevels},(_,i)=>i+1).every(i=>progress[i]==="completed")){backToMenu();return}
 $("certificateDetails").textContent="Khaemenes Academy · French 101 · Final score: "+(progress.examScore??"Legacy pass")+"/10 · Completed: "+(progress.completedAt?new Date(progress.completedAt).toLocaleDateString():"Date not recorded");
 showOnly("certificate");launchConfetti();
 if(!$("certificateBack")){const b=addButton($("certificate"),"Back to Levels",backToMenu);b.id="certificateBack"}
}
function launchConfetti(){
 if(window.matchMedia?.("(prefers-reduced-motion: reduce)").matches)return;
 for(let i=0;i<50;i++){
  const confetti=element("div","","confetti");
  confetti.style.left=Math.random()*100+"vw";
  confetti.style.animationDelay=Math.random()*2+"s";
  document.body.append(confetti);setTimeout(()=>confetti.remove(),5000);
 }
}
applyTheme();

</script>
<script src="/assets/vnv-beta-link.js" defer></script>
</body>
</html>
