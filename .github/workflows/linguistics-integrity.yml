name: Linguistics Repository Integrity
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/vnv-language.js'
      - 'apps/**'
      - 'Halls/**'
      - 'service-worker.js'
      - 'scripts/audit-linguistics.mjs'
      - 'scripts/test-french-reader.mjs'
      - 'scripts/test-german-coach.mjs'
      - 'scripts/test-german-studios.mjs'
      - 'scripts/test-german-print.mjs'
      - 'scripts/test-russian-conversation.mjs'
      - 'scripts/test-russian-mastery.mjs'
      - 'scripts/test-russian-recovery-flow.mjs'
      - 'scripts/test-french-recovery-flow.mjs'
      - 'scripts/test-german-recovery-flow.mjs'
      - 'scripts/test-bilingual-portfolios.mjs'
      - 'scripts/test-academy-evidence-links.mjs'
      - 'assets/german-portfolio-print.js'
      - 'assets/arabic-mastery-pilot.js'
      - 'assets/foundation-unit02-recovery.js'
      - 'scripts/test-foundation-unit02-recovery.mjs'
      - 'scripts/test-arabic-pilot.mjs'
      - 'scripts/test-arabic-mastery-map.mjs'
      - 'scripts/test-language-worlds.mjs'
      - 'scripts/test-high-school-language-handoff.mjs'
      - 'scripts/test-foundation-unit02.mjs'
      - 'assets/foundation-unit02-lesson.js'
      - 'assets/foundation-unit02-challenge.js'
      - 'assets/unit01-language-checkpoint.js'
      - 'scripts/test-unit01-language-checkpoints.mjs'
      - 'scripts/test-unit01-checkpoint-behavior.mjs'
      - 'scripts/test-foundation-performance.mjs'
      - 'scripts/test-foundation-two-learners.mjs'
      - 'assets/foundation-performance-rubric.js'
      - '.github/workflows/linguistics-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run offline structural integrity checks
        run: node scripts/audit-linguistics.mjs
      - name: Test French reader interactions
        run: node scripts/test-french-reader.mjs
      - name: Test German Coach learner isolation
        run: node scripts/test-german-coach.mjs
      - name: Test German studio interactions
        run: node scripts/test-german-studios.mjs
      - name: Verify German portfolio print evidence
        run: node scripts/test-german-print.mjs
      - name: Test Russian Conversation World
        run: node scripts/test-russian-conversation.mjs
      - name: Test Russian Mastery Constellation
        run: node scripts/test-russian-mastery.mjs
      - name: Test Russian learner backup recovery isolation
        run: node scripts/test-russian-recovery-flow.mjs
      - name: Test French learner backup recovery isolation
        run: node scripts/test-french-recovery-flow.mjs
      - name: Test German learner backup recovery isolation
        run: node scripts/test-german-recovery-flow.mjs
      - name: Test Arabic Week 01–02 mastery pilot
        run: node scripts/test-arabic-pilot.mjs
      - name: Test Arabic learner mastery map
        run: node scripts/test-arabic-mastery-map.mjs
      - name: Verify Foundation Unit 02 curriculum
        run: node scripts/test-foundation-unit02.mjs
      - name: Verify language-world entrance routes
        run: node scripts/test-language-worlds.mjs
      - name: Verify High School language handoff
        run: node scripts/test-high-school-language-handoff.mjs
      - name: Test foundation performance rubrics
        run: node scripts/test-foundation-performance.mjs
      - name: Simulate foundation two-learner review isolation
        run: node scripts/test-foundation-two-learners.mjs
      - name: Test Unit 01 language checkpoints
        run: node scripts/test-unit01-language-checkpoints.mjs
      - name: Test Unit 01 checkpoint two-learner behavior
        run: node scripts/test-unit01-checkpoint-behavior.mjs
      - name: Verify three-language Unit 02 protected recovery
        run: node scripts/test-foundation-unit02-recovery.mjs
      - name: Test bilingual homeschool portfolios
        run: node scripts/test-bilingual-portfolios.mjs
      - name: Verify shared Academy evidence adoption
        run: node scripts/test-academy-evidence-links.mjs
