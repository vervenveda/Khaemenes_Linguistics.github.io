name: Linguistics Repository Integrity
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/vnv-language.js'
      - 'apps/**'
      - 'Halls/**'
      - 'service-worker.js'
      - 'scripts/audit-linguistics.mjs'
      - 'scripts/test-french-reader.mjs'
      - 'scripts/test-german-coach.mjs'
      - 'scripts/test-german-studios.mjs'
      - 'scripts/test-german-print.mjs'
      - 'assets/german-portfolio-print.js'
      - '.github/workflows/linguistics-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run offline structural integrity checks
        run: node scripts/audit-linguistics.mjs
      - name: Test French reader interactions
        run: node scripts/test-french-reader.mjs
      - name: Test German Coach learner isolation
        run: node scripts/test-german-coach.mjs
      - name: Test German studio interactions
        run: node scripts/test-german-studios.mjs
      - name: Verify German portfolio print evidence
        run: node scripts/test-german-print.mjs
