name: Linguistics Official Translator Rollout
on:
  push:
    branches: [main]
    paths:
      - scripts/validate-year-i-evidence-journal.mjs
      - assets/year-i-evidence-journal.js
      - scripts/validate-linguistics-translator-navigation.mjs
      - scripts/validate-other-language-courses.mjs
      - scripts/rollout-linguistics-page-translator.mjs
      - .github/workflows/linguistics-translation-rollout.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: linguistics-translation-rollout
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official language controls and accessible course navigation
        run: node scripts/rollout-linguistics-page-translator.mjs --apply
      - name: Verify complete HTML coverage and all 64 weekly routes
        run: node scripts/rollout-linguistics-page-translator.mjs
      - name: Check course navigation and protect language-learning examples
        run: node scripts/validate-linguistics-translator-navigation.mjs
      - name: Validate Year I evidence journal
        run: node scripts/validate-year-i-evidence-journal.mjs
      - name: Audit additional language courses and deduplicated translator coverage
        run: node scripts/validate-other-language-courses.mjs
      - name: Commit verified additions to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Install canonical Linguistics translator and Year I navigation"
            git push origin HEAD:main
          fi
