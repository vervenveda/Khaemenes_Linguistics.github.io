name: Sovereign Dictionary Integrity
on:
  push:
    branches: [main]
    paths:
      - 'data/sovereign-dictionary.v1.json'
      - 'assets/sovereign-dictionary.generated.js'
      - 'assets/khaemenes-interlingual-core.js'
      - 'assets/khaemenes-review-policy.js'
      - 'assets/khaemenes-translation-candidate-lab.js'
      - 'assets/khaemenes-translation-teacher-arbiter.js'
      - 'assets/khaemenes-translation-candidate-ui.js'
      - 'scripts/translation-candidate-lab.test.mjs'
      - 'scripts/translation-teacher-arbiter.test.mjs'
      - 'scripts/translator-canonical-landing.test.mjs'
      - 'scripts/audit-translation-trust.mjs'
      - 'service-worker.js'
      - 'apps/translator.html'
      - 'apps/translator-entry.html'
      - 'scripts/audit-dictionary.mjs'
      - '.github/workflows/sovereign-dictionary-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public dictionary sources, offline API and bilingual safeguards
        run: node scripts/audit-dictionary.mjs
      - name: Verify reviewed translation import and promotion safety
        run: node scripts/audit-translation-trust.mjs
      - name: Verify opt-in observation and laNGgwij-inspired WITHHOLD behavior
        run: node --test scripts/translation-candidate-lab.test.mjs scripts/translation-teacher-arbiter.test.mjs scripts/translator-canonical-landing.test.mjs
