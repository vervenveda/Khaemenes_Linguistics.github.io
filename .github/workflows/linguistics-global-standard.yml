name: Linguistics Global Standard

on:
  push:
    branches: [main]
    paths:
      - 'assets/linguistics-global-standard-v1.js'
      - 'tools/linguistics-global-standard-audit.mjs'
      - 'tools/semantic-hierarchy-audit.mjs'
      - '.github/workflows/linguistics-global-standard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linguistics typography and chrome authority
        run: node tools/linguistics-global-standard-audit.mjs --write
      - name: Verify Linguistics global standard coverage
        run: node tools/linguistics-global-standard-audit.mjs --check
      - name: Verify semantic title eyebrow hierarchy
        run: node tools/semantic-hierarchy-audit.mjs
      - name: Validate patch
        run: git diff --check
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Linguistics pages required global-standard repair."
            exit 0
          fi
          git config user.name "Khaemenes Academy Automation"
          git config user.email "khaemenesacademy@users.noreply.github.com"
          git add -A -- ':!node_modules' ':!.git'
          git commit -m "Standardize Linguistics global chrome and typography"
          git push
