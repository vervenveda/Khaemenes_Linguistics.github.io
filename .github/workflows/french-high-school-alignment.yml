name: French high-school four-grade alignment

on:
  push:
    branches: [main]
    paths:
      - 'Halls/index.html'
      - 'scripts/test-french-high-school-four-grade-alignment.mjs'
      - 'scripts/test-french-four-grade-score-input.mjs'
      - 'scripts/test-french-high-school-assessment-provenance.mjs'
      - 'assets/french-high-school-assessment-contract.mjs'
      - 'scripts/test-french-high-school-assessment-contract.mjs'
      - 'scripts/test-french-high-school-authored-unit01-lesson01.mjs'
      - 'scripts/test-french-high-school-lesson01-editorial-regressions.mjs'
      - 'data/french-hs1-unit01-lesson01-bank.json'
      - 'data/french-hs2-unit01-lesson01-bank.json'
      - 'data/french-hs3-unit01-lesson01-bank.json'
      - 'data/french-hs4-unit01-lesson01-bank.json'
      - '.github/workflows/french-high-school-alignment.yml'
  pull_request:
    paths:
      - 'Halls/index.html'
      - 'scripts/test-french-high-school-four-grade-alignment.mjs'
      - 'scripts/test-french-four-grade-score-input.mjs'
      - 'scripts/test-french-high-school-assessment-provenance.mjs'
      - 'assets/french-high-school-assessment-contract.mjs'
      - 'scripts/test-french-high-school-assessment-contract.mjs'
      - 'scripts/test-french-high-school-authored-unit01-lesson01.mjs'
      - 'scripts/test-french-high-school-lesson01-editorial-regressions.mjs'
      - 'data/french-hs1-unit01-lesson01-bank.json'
      - 'data/french-hs2-unit01-lesson01-bank.json'
      - 'data/french-hs3-unit01-lesson01-bank.json'
      - 'data/french-hs4-unit01-lesson01-bank.json'
      - '.github/workflows/french-high-school-alignment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-grade-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify four French high-school courses and distinct college routes
        run: node scripts/test-french-high-school-four-grade-alignment.mjs
      - name: Guard manual assessment score validity for all four grades
        run: node scripts/test-french-four-grade-score-input.mjs
      - name: Guard French I-IV score provenance and historical record disclosure
        run: node scripts/test-french-high-school-assessment-provenance.mjs
      - name: Test fail-closed French I-IV assessment contract
        run: node --test scripts/test-french-high-school-assessment-contract.mjs
      - name: Validate authored Unit 01 Lesson 01 question banks for all four grades
        run: node --test scripts/test-french-high-school-authored-unit01-lesson01.mjs
      - name: Guard corrected ambiguity and question fairness across four grades
        run: node --test scripts/test-french-high-school-lesson01-editorial-regressions.mjs
