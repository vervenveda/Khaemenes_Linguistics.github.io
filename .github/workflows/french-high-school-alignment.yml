name: French high-school four-grade alignment

on:
  push:
    branches: [main]
    paths:
      - 'Halls/index.html'
      - 'scripts/test-french-high-school-four-grade-alignment.mjs'
      - 'scripts/test-french-four-grade-score-input.mjs'
      - '.github/workflows/french-high-school-alignment.yml'
  pull_request:
    paths:
      - 'Halls/index.html'
      - 'scripts/test-french-high-school-four-grade-alignment.mjs'
      - 'scripts/test-french-four-grade-score-input.mjs'
      - '.github/workflows/french-high-school-alignment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-grade-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify four French high-school courses and distinct college routes
        run: node scripts/test-french-high-school-four-grade-alignment.mjs
      - name: Guard manual assessment score validity for all four grades
        run: node scripts/test-french-four-grade-score-input.mjs
