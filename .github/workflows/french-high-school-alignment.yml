permissions:
  contents: read

jobs:
  four-grade-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify four French high-school courses and distinct college routes
        run: node scripts/test-french-high-school-four-grade-alignment.mjs
      - name: Guard manual assessment score validity for all four grades
        run: node scripts/test-french-four-grade-score-input.mjs
      - name: Guard French I-IV score provenance and historical record disclosure
        run: node scripts/test-french-high-school-assessment-provenance.mjs
      - name: Test fail-closed French I-IV assessment contract
        run: node --test scripts/test-french-high-school-assessment-contract.mjs
      - name: Validate authored Unit 01 Lesson 01 question banks for all four grades
        run: node --test scripts/test-french-high-school-authored-unit01-lesson01.mjs
      - name: Guard corrected ambiguity and question fairness across four grades
        run: node --test scripts/test-french-high-school-lesson01-editorial-regressions.mjs
      - name: Validate authored Unit 01 Lesson 02 across French I-IV
        run: node --test scripts/test-french-high-school-authored-unit01-lesson02.mjs
      - name: Validate Unit 01 Lesson 03 banks for French I-IV
        run: node --test scripts/test-french-high-school-authored-unit01-lesson03.mjs
      - name: Verify synchronized authored French I-IV Lesson 04 banks
        run: node --test scripts/test-french-high-school-authored-unit01-lesson04.mjs
      - name: Verify synchronized authored French I-IV Lesson 05 banks
        run: node --test scripts/test-french-high-school-authored-unit01-lesson05.mjs
      - name: Validate Unit 01 Lesson 06 integration missions for all four courses
        run: node --test scripts/test-french-high-school-authored-unit01-lesson06.mjs
      - name: Audit complete six-lesson Unit 01 authored banks for four grades
        run: node --test scripts/test-french-high-school-unit01-six-lesson-integrity.mjs
      - name: Guard six-lesson and three-domain balance for French I-IV Unit 01
        run: node --test scripts/test-french-high-school-unit01-balanced-exam.mjs
      - name: Verify accessible four-grade Unit 01 instructional companion and Hall routing
        run: node --test scripts/test-french-high-school-unit01-instructional-companion.mjs
      - name: Enforce Lesson 01 canonical structure for all 24 guided lessons
        run: node --test scripts/test-french-high-school-unit01-lesson01-canonical-layout.mjs
      - name: Preserve original French I-IV Hall themes against pilot crosswalk
        run: node --test scripts/test-french-high-school-unit01-pilot-crosswalk.mjs
      - name: Check French III education and French IV identity-migration pilot instruction
        run: node --test scripts/test-french-high-school-unit01-education-migration-context.mjs
      - name: Validate 324 French III-IV item classifications without approving exams
        run: node --test scripts/test-french-high-school-unit01-hs3-hs4-item-crosswalk.mjs
      - name: Check 54 French III school-context language-use revisions
        run: node --test scripts/test-french-high-school-unit01-hs3-education-language-use.mjs
      - name: Validate 60 French III education reading and application tasks
        run: node --test scripts/test-french-high-school-unit01-hs3-education-interpretive-transfer.mjs
      - name: Validate 54 French IV migration-context language-use questions and reserves
        run: node --test scripts/test-french-high-school-unit01-hs4-migration-language-use.mjs
      - name: Verify French III-IV bilingual editorial corrections and all 324 draft keys
        run: node --test scripts/test-french-high-school-unit01-bilingual-editorial-repair.mjs
      - name: Verify twelve extended French III-IV readings and 36 formative practice questions
        run: node --test scripts/test-french-high-school-unit01-extended-reading-labs.mjs
      - name: Guard fourteen targeted French III-IV distractor quality repairs
        run: node --test scripts/test-french-high-school-unit01-distractor-quality.mjs
      - name: Verify twelve teacher-led French III-IV oral and listening practice activities
        run: node --test scripts/test-french-high-school-unit01-guided-listening-speaking.mjs
      - name: Verify 12 integrated reading-to-writing and oral-evidence progression bridges
        run: node --test scripts/test-french-high-school-unit01-integrated-evidence-bridges.mjs
      - name: Check French I-II 12 foundational four-skill lessons and 36 accurate reading keys
        run: node --test scripts/test-french-high-school-unit01-hs1-hs2-four-skills.mjs
      - name: Guard French I-IV readable layouts, scoped printing, navigation and student draft safety
        run: node --test scripts/test-french-high-school-unit01-responsive-print-ux.mjs
